# ULTIMO TAGLIO — simulatore di disinnesco di un ordigno di scena, da film.
# Sito statico (Vite) in /var/www/html/ultimo-taglio, servito sotto /ultimo-taglio/.
# Installazione: conf-available/ultimo-taglio.conf + a2enconf (vedi installa-balthasar.sh).
# Su Balthasar AllowOverride e' None: le regole stanno qui.

<Directory /var/www/html/ultimo-taglio>
    Options -Indexes
    Require all granted
    AddType model/gltf-binary .glb
    <IfModule mod_headers.c>
        # La pagina e la versione si ricontrollano sempre; gli asset hanno l'impronta nel nome.
        <FilesMatch "^(index\.html|version\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</Directory>

<Directory /var/www/html/ultimo-taglio/assets>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

# Modelli 3D: nomi stabili, una settimana di cache.
<Directory /var/www/html/ultimo-taglio/models>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=604800"
    </IfModule>
</Directory>

# /ultimo-taglio (senza barra) → /ultimo-taglio/
RedirectMatch 301 ^/ultimo-taglio$ /ultimo-taglio/
